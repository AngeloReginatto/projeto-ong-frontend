<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa ONG - Cadastro</title>
</head>
<body>
  <header>
    <h1>Cadastro de Colaborador</h1>
    <nav class="menu-principal" aria-label="Navegação principal">

        <input
            type="checkbox"
           id="menu-toggle"
            class="menu-toggle">

        <label for="menu-toggle" class="menu-hamburguer">
            <span class="icone-hamburguer" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
           </span>
           <span>Menu</span>
       </label>

       <ul class="menu-lista">
            <li>
                <a href="index.html">Início</a>
            </li>

            <li class="tem-submenu">
                <button
                   type="button"
                   class="submenu-trigger"
                   aria-haspopup="true">
                    Projetos
                </button>

                <ul class="submenu">
                    <li>
                        <a href="projetos.html#campanhas">
                            Campanhas de doação
                        </a>
                   </li>

                    <li>
                       <a href="projetos.html#voluntariado">
                           Voluntariado
                        </a>
                   </li>
                </ul>
            </li>

            <li>
                <a href="cadastro.html">Participe</a>
            </li>
        </ul>

    </nav>
  </header>

  <main>
    <section>
      <h2>Formulário de participação</h2>

      <form action="#" method="post">
        <fieldset>
          <legend>Dados pessoais</legend>

          <p><label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required></p>

          <p><label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric"
                 pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                 placeholder="000.000.000-00"
                 title="Digite o CPF no formato 000.000.000-00" required></p>

          <p><label for="email">E-mail:</label>
          <input type="email" id="email" name="email" autocomplete="email" required></p>

          <p><label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" autocomplete="tel"
                 pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                 placeholder="(51) 99999-9999"
                 title="Digite o telefone no formato (00) 00000-0000" required></p>

          <p><label for="nascimento">Data de nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" autocomplete="bday" required></p>
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <p><label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" inputmode="numeric"
                 pattern="[0-9]{5}-[0-9]{3}"
                 placeholder="00000-000"
                 title="Digite o CEP no formato 00000-000"
                 autocomplete="postal-code" required></p>

          <p><label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" autocomplete="address-line1" required></p>

          <p><label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" autocomplete="address-level2" required></p>

          <p><label for="estado">Estado (UF):</label>
          <input type="text" id="estado" name="estado" maxlength="2"
                 pattern="[A-Za-z]{2}"
                 title="Digite a sigla do estado com duas letras"
                 autocomplete="address-level1" required></p>
        </fieldset>

        <fieldset>
          <legend>Forma de participação</legend>

          <p><input type="radio" id="voluntariado" name="participacao" value="voluntariado" required>
          <label for="voluntariado">Trabalho voluntário</label></p>

          <p><input type="radio" id="doacao" name="participacao" value="doacao">
          <label for="doacao">Contribuição financeira</label></p>

          <p><input type="radio" id="ambos" name="participacao" value="ambos">
          <label for="ambos">Ambos</label></p>
        </fieldset>

        <p><button type="submit">Enviar cadastro</button></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Nossa ONG. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
